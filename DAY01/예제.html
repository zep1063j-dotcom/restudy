<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DAY01 연습</title>
  <!-- 아래 공통 CSS는 읽기 편한 기본 모양입니다. 오늘의 학습 코드는 body부터입니다. -->
  <link rel="stylesheet" href="../공통/example.css">
</head>
<body>
<!-- DAY01: 태그 사이의 글자와 속성의 값을 구분해 읽습니다. -->
<!-- 1. title은 브라우저 탭 제목입니다. 이 미리보기에서는 바깥 탭 대신 예제 이름으로 확인하세요. -->
<h1>오즈 카페</h1>
<p>커피와 빵을 판매합니다.</p>
<h2>인기 메뉴</h2>
<ul>
  <li>아메리카노 4000원</li>
  <li>소금빵 3500원</li>
</ul>
<!-- 2. href는 이동할 주소, 태그 사이의 글자는 화면에 보이는 이름입니다. -->
<a href="#contact">연락처 보기</a>
<hr>
<section id="contact">
  <h2>연락처</h2>
  <p>서울시 카페길 1 (연습용 주소)</p>
</section>
</body>
</html>
