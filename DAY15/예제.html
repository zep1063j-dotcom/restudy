<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DAY15 연습</title>
  <!-- 아래 공통 CSS는 읽기 편한 기본 모양입니다. 오늘의 학습 코드는 body부터입니다. -->
  <link rel="stylesheet" href="../공통/example.css">
</head>
<body>
<h1>JavaScript로 목록 그리기</h1><ul id="list"></ul>
<script>
const items = [
  { name: "여권", packed: true },
  { name: "충전기", packed: false },
  { name: "지갑", packed: false }
];
const list = document.querySelector("#list");
items.forEach(item => {
  const li = document.createElement("li"); // 아직 화면에는 없습니다.
  li.textContent = item.name;
  if (item.packed) li.classList.add("done");
  list.appendChild(li); // 화면에 붙입니다.
});
</script>
</body>
</html>
