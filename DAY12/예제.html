<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <title>DAY12 연습</title>
    <!-- 아래 공통 CSS는 읽기 편한 기본 모양입니다. 오늘의 학습 코드는 body부터입니다. -->
    <link rel="stylesheet" href="../공통/example.css" />
  </head>
  <body>
    <h1>저축 목표 계산</h1>
    <pre id="result"></pre>
    <script>
      // 매개변수로 받은 값으로 계산하고 return으로 결과를 돌려줍니다.
      function monthsToGoal(monthly, goal) {
        if (monthly <= 0 || goal <= 0) return 0;
        let total = 0;
        let months = 0;
        while (total < goal) {
          total += monthly;
          months += 1;
        }
        return months;
      }
      const months = monthsToGoal(30000, 100000);
      console.log("필요한 달 수:", months);
      document.querySelector("#result").textContent =
        `${months}개월이 필요합니다.`;
    </script>
  </body>
</html>
