<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1"
    />
    <title>카페 주문 앱</title>
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <main>
      <h1>카페 주문 앱</h1>
      <p><a href="react.html">같은 API를 쓰는 React 화면</a></p>
      <p id="status" role="status">메뉴를 불러옵니다.</p>
      <section
        id="menu-list"
        class="cards"
        aria-label="서버 메뉴"
      ></section>
      <form id="order-form">
        <label for="menu">메뉴</label
        ><select id="menu" required></select
        ><label for="qty">수량 (1~20)</label
        ><input
          id="qty"
          type="number"
          value="1"
          min="1"
          max="20"
          required
        /><button id="submit" disabled>주문 저장</button>
      </form>
      <h2>주문 기록</h2>
      <ul id="orders"></ul>
      <p class="notice">
        실제 결제나 계정 기능이 없는 로컬 단일 프로세스 학습
        앱입니다. 가격과 총액은 서버가 계산합니다.
      </p>
    </main>
  </body>
</html>
