<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DAY27 연습</title>
  <!-- 아래 공통 CSS는 읽기 편한 기본 모양입니다. 오늘의 학습 코드는 body부터입니다. -->
  <link rel="stylesheet" href="../공통/example.css">
</head>
<body>
<!-- React는 준비된 로컬 파일에서 불러옵니다. 인터넷 연결이 필요 없습니다. -->
<div id="root"></div>
<script src="../공통/vendor/react-local.js"></script>
<script src="../공통/vendor/babel.min.js"></script>
<script src="../공통/vendor/babel-config.js"></script>
<script type="text/babel" data-presets="studyReact">
// 개발 환경 설치 절차 대신, 바로 컴포넌트의 첫 화면을 읽는 예제입니다.
function App() {
  return (
    <main>
      <h1>오즈 카페</h1>
      <p>메뉴를 고르고 주문하는 동네 카페 앱입니다.</p>
    </main>
  );
}
ReactDOM.createRoot(document.querySelector("#root")).render(<App />);
</script>
</body>
</html>
